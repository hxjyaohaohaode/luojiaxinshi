name: campus-notice
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Please set HTTPS APP_ORIGIN in .env}
      APP_HOST: 0.0.0.0
      APP_PORT: 8765
      DATA_DIR: /data
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - campus-data:/data
    expose:
      - "8765"
    mem_limit: 768m
    cpus: 2
    pids_limit: 96
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os; r=urllib.request.Request('http://127.0.0.1:8765/api/health',headers={'Host':os.environ['APP_ORIGIN'].split('://')[1]}); urllib.request.urlopen(r,timeout=3)"]
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Please set APP_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  campus-data:
  caddy-data:
  caddy-config:
