<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>生成式界面 · 组件验收</title><link rel="icon" href="/static/assets/campus-notice-icon-v4-64.png" type="image/png" sizes="64x64"><link rel="stylesheet" href="/static/genui/genui.css"><script type="module" src="/static/genui/gallery.js"></script></head>
<body><main class="gu-gallery" data-genui-theme="light"><header class="gu-gallery-header"><div><h1>生成式界面 · 组件验收</h1><p>这里全部是工程示例，不读取账户数据。</p></div><div class="gu-button-group"><button type="button" class="gu-button" id="run-tests">运行组件验证</button><button type="button" class="gu-button" id="run-e2e">运行隔离对话验收</button></div></header><div class="gu-gallery-controls"><label>组件<select id="component"><option value="all">全部组件</option></select></label><label>状态<select id="variant"><option value="ready">默认</option><option value="loading">加载中</option><option value="empty">空内容</option><option value="error">错误</option><option value="long">长文本</option><option value="stream">渐进接收</option></select></label><label>主题<select id="theme"><option value="light">亮色</option><option value="dark">暗色</option></select></label><label>宽度<select id="width"><option value="wide">自适应</option><option value="narrow">窄屏 320</option></select></label></div><details class="gu-dev-material"><summary>工程素材</summary><button type="button" class="gu-button" id="record-demo">生成本地视频验收素材</button></details><div id="gallery-result"></div><div class="gu-test-output"><p role="status" id="gallery-status">选择组件查看，或运行无网络的组件测试。</p><details><summary>验证明细</summary><pre id="gallery-log"></pre></details></div></main></body></html>
