<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>生成式内容工作台 · 珞珈信使</title>
<link rel="icon" href="/static/assets/campus-notice-icon-v4-64.png" type="image/png" sizes="64x64">
<link rel="stylesheet" href="/static/genui/genui.css"><link rel="stylesheet" href="/static/genui/citations.css"><link rel="stylesheet" href="/static/genui/editorial.css"><script type="module" src="/static/genui/gallery.js"></script>
</head><body><main class="gu-gallery" data-genui-theme="light">
<header class="gu-gallery-header"><p class="gu-gallery-eyebrow">珞珈信使 / 交互预览</p><h1>让内容成为可操作的回答</h1><p>阅读、对照、追问，也可以换个情境练习。以下内容均为虚构演示，结构和交互可以自由改写。</p></header>
<nav class="gu-gallery-nav" aria-label="内容演示"><button type="button" data-scene="news" aria-pressed="true">新闻对照</button><button type="button" data-scene="brief" aria-pressed="false">内容简报</button><button type="button" data-scene="notice" aria-pressed="false">公示演练</button><button type="button" data-scene="review" aria-pressed="false">研读与改稿</button></nav>
<div id="gallery-result"></div>
<details class="gu-gallery-tools"><summary>查看组成与验证工具</summary>
<div class="gu-gallery-controls"><label>示例与原语<select id="component"><option value="all">全部组件</option></select></label><label>状态<select id="variant"><option value="ready">默认</option><option value="loading">加载中</option><option value="empty">空内容</option><option value="error">错误</option><option value="long">长文本</option><option value="stream">渐进接收</option></select></label><label>主题<select id="theme"><option value="light">亮色</option><option value="dark">暗色</option></select></label><label>宽度<select id="width"><option value="wide">自适应</option><option value="narrow">窄屏 320</option></select></label></div>
<div class="gu-button-group"><button type="button" class="gu-button" id="run-tests">运行组件验证</button><button type="button" class="gu-button" id="run-e2e">运行隔离对话验收</button></div>
<details class="gu-dev-material"><summary>工程素材</summary><button type="button" class="gu-button" id="record-demo">生成本地视频验收素材</button></details>
<details class="gu-composition-editor"><summary>自由改写内容与结构</summary><p>这里可以修改内容、层级、视角和交互关系。演示不是模型可选界面的清单。</p><label for="composition-source">当前内容与界面描述</label><textarea id="composition-source" spellcheck="false"></textarea><button type="button" class="gu-button" id="render-composition">应用并预览</button></details></details>
<div class="gu-test-output"><p role="status" id="gallery-status"></p><details><summary>验证明细</summary><pre id="gallery-log"></pre></details></div>
</main></body></html>
