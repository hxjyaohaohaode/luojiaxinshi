name: 项目检查
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CAMPUS_AUTO_LOAD_ENV: '0'
  PYTHONUNBUFFERED: '1'
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Include every backend shard, parser installation, audit and release check.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - name: Require reproducible frontend bundles and route chunks
        run: npm run build:check
      - name: Install the checksum-pinned legacy Office parser
        run: python scripts/install_legacy_parser.py
      - name: Run every backend file in isolated shards
        run: python scripts/audit_full_suite.py --workers 4 --output artifacts/ci/backend --junitxml artifacts/ci/python-tests.xml
      - run: node --test --test-reporter=junit --test-reporter-destination=artifacts/ci/node-tests.xml tests/*.test.mjs
      - run: python scripts/genui_catalog.py --check
      - run: python scripts/evaluate_genui.py
      - run: npm audit --omit=dev
      - run: python -m pip_audit -r requirements.lock --strict
      - run: python scripts/verify_retrieval_quality.py
      - run: python scripts/verify_campus_capacity.py
      - run: python scripts/verify_local_runtime.py
      - run: python scripts/build_release.py
      - name: Write test counts to the run summary
        if: always()
        run: python scripts/write_ci_summary.py --kind unit
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-reports-${{ matrix.os }}
          path: |
            artifacts/ci/python-tests.xml
            artifacts/ci/backend/*.xml
            artifacts/ci/backend/*.json
            artifacts/ci/backend/*.log
            artifacts/ci/node-tests.xml
            artifacts/ci/summary.md
            artifacts/proactive-retrieval-comparison.json
            artifacts/campus-capacity-matters/capacity-benchmark.json
          retention-days: 14
          if-no-files-found: warn
  windows-backend:
    name: Windows backend (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - name: Require reproducible frontend bundles and route chunks
        run: npm run build:check
      - run: python scripts/install_legacy_parser.py
      - name: Run this exact declared backend partition
        run: python scripts/audit_full_suite.py --workers 4 --only-shard ${{ matrix.shard }} --output artifacts/ci/windows-backend
      - name: Preserve this attempt's real partition reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-backend-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/ci/windows-backend/*.json
            artifacts/ci/windows-backend/*.xml
            artifacts/ci/windows-backend/*.log
          retention-days: 14
          if-no-files-found: error
  windows-results:
    name: tests (windows-latest)
    needs: windows-backend
    if: always()
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - name: Require reproducible frontend bundles and route chunks
        run: npm run build:check
      - name: Download every partition from this exact workflow attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-backend-*-attempt-${{ github.run_attempt }}
          path: artifacts/windows-partitions
          merge-multiple: false
      - name: Require the complete current-code inventory and real JUnit union
        if: always()
        run: python scripts/audit_full_suite.py --workers 4 --merge-partitions artifacts/windows-partitions --output artifacts/ci/backend --junitxml artifacts/ci/python-tests.xml
      - name: Run all Windows frontend unit cases
        if: always()
        run: node --test --test-reporter=junit --test-reporter-destination=artifacts/ci/node-tests.xml tests/*.test.mjs
      - name: Validate the generated UI catalog and evaluation
        if: always()
        run: |
          python scripts/genui_catalog.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/evaluate_genui.py
      - name: Audit production Node dependencies
        if: always()
        run: npm audit --omit=dev
      - name: Audit production Python dependencies
        if: always()
        run: python -m pip_audit -r requirements.lock --strict
      - name: Verify real HTTP concurrency, restart and restore
        if: always()
        run: python scripts/verify_local_runtime.py
      - name: Verify offline retrieval and full default account capacity
        if: always()
        run: |
          python scripts/verify_retrieval_quality.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_campus_capacity.py
      - name: Build the source delivery archive
        if: always()
        run: python scripts/build_release.py
      - name: Write complete Windows counts
        if: always()
        run: python scripts/write_ci_summary.py --kind unit
      - name: Upload complete Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-reports-windows-latest
          path: |
            artifacts/ci/python-tests.xml
            artifacts/ci/backend/*.json
            artifacts/ci/node-tests.xml
            artifacts/ci/summary.md
            artifacts/proactive-retrieval-comparison.json
            artifacts/campus-capacity-matters/capacity-benchmark.json
          retention-days: 14
          if-no-files-found: warn
  browser:
    runs-on: ubuntu-24.04
    container:
      # Keep the image version in sync with package-lock.json. Browsers and OS
      # dependencies are preinstalled, avoiding apt mirror outages on each run.
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host --user 1001
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - name: Require reproducible frontend bundles and route chunks
        run: npm run build:check
      - name: Verify all preinstalled browsers can launch
        run: >-
          node --input-type=module -e 'import { chromium, firefox, webkit } from "playwright";
          for (const engine of [chromium, firefox, webkit]) {
          const browser = await engine.launch({headless:true, executablePath:engine.executablePath()});
          await browser.close(); console.log(engine.name() + " ready"); }'
      - name: Run the browser suites against synthetic data
        id: browser-suites
        run: python scripts/run_browser_checks.py
      - name: Verify embedded Agent approvals, UI, media and incremental rendering
        if: ${{ !cancelled() && steps.browser-suites.outcome != 'skipped' }}
        run: python scripts/run_agent_browser_checks.py
      - name: Verify streaming OpenUI in Chromium, Firefox and WebKit
        if: always()
        run: python scripts/run_openui_browser_checks.py
      - name: Verify compact chat layout and reading chrome
        if: always()
        env:
          OPENUI_VERIFY_SCRIPT: scripts/verify_chat_layout.mjs
        run: python scripts/run_openui_browser_checks.py
      - name: Verify chat controls, execution trace, reading anchors and reversible new-chat gestures
        if: always()
        env:
          OPENUI_VERIFY_SCRIPT: scripts/verify_chat_interactions.mjs
        run: python scripts/run_openui_browser_checks.py
      - name: Verify reload during review and persistent reply revisions
        if: always()
        env:
          OPENUI_VERIFY_SCRIPT: scripts/verify_chat_recovery.mjs
        run: python scripts/run_openui_browser_checks.py
      - name: Write browser counts including streaming OpenUI
        if: always()
        run: python scripts/write_ci_summary.py --kind browser
      - name: Upload synthetic browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-browser-reports
          path: |
            artifacts/sprint-ui-browser/*
            artifacts/ci-browser/verify_sprint_ui.mjs.log
            artifacts/frontend-v9-browser/report.json
            artifacts/frontend-v9-browser/*.png
            artifacts/frontend-v8-browser/report.json
            artifacts/frontend-v8-browser/*.png
            artifacts/reference-interactions-browser/report.json
            artifacts/reference-interactions-browser/*.png
            artifacts/workspace-interactions-browser/report.json
            artifacts/workspace-interactions-browser/*.png
            artifacts/visual-review-browser/report.json
            artifacts/visual-review-browser/*.png
            artifacts/notice-flow-browser/report.json
            artifacts/notice-flow-browser/*.png
            artifacts/task-board-browser/report.json
            artifacts/task-board-browser/*.png
            artifacts/natural-intake-browser/*
            artifacts/task-materials-browser/*
            artifacts/source-inbox-browser/*
            artifacts/notice-matters-browser/*
            artifacts/source-presets-browser/*
            artifacts/pilot-workspace-browser/*
            artifacts/qq-group-intake-browser/*
            artifacts/push-browser/*
            artifacts/ci-browser/verify_natural_intake.mjs.log
            artifacts/ci-browser/verify_task_materials.mjs.log
            artifacts/ci-browser/verify_source_inbox.mjs.log
            artifacts/ci-browser/verify_notice_matters.mjs.log
            artifacts/ci-browser/verify_qq_group_intake_ui.mjs.log
            artifacts/ci-browser/verify_push_browser.mjs.log
            artifacts/ci-browser/verify_task_board.mjs.log
            artifacts/ci-browser/verify_frontend_stability.mjs.log
            artifacts/ci-browser/verify_frontend_review.mjs.log
            artifacts/ci-browser/verify_reference_interactions.mjs.log
            artifacts/ci-browser/verify_workspace_interactions.mjs.log
            artifacts/ci-browser/verify_visual_review.mjs.log
            artifacts/ci-browser/verify_notice_flow.mjs.log
            artifacts/ci-agent-browser/*.log
            artifacts/ci-agent-browser/results.json
            artifacts/agent-chat-browser/results.json
            artifacts/agent-chat-browser/*.png
            artifacts/agent-adaptive-browser/results.json
            artifacts/agent-adaptive-browser/*.png
            artifacts/reference-fusion/browser/results.json
            artifacts/reference-fusion/browser/*.png
            artifacts/agent-quality-browser/performance.json
            artifacts/composer-browser/results.json
            artifacts/composer-browser/*.png
            artifacts/openui-browser/*/report.json
            artifacts/openui-browser/*/*.png
            artifacts/chat-layout/*/report.json
            artifacts/chat-layout/*/*.png
            artifacts/chat-interactions/*/report.json
            artifacts/chat-interactions/*/*.png
            artifacts/chat-recovery/*/report.json
            artifacts/chat-recovery/*/*.png
            artifacts/ci-openui-browser/*.log
            artifacts/ci-openui-browser/results.json
            artifacts/ci/summary.md
          retention-days: 14
          if-no-files-found: warn
  continuity:
    name: Async save and recovery
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host --user 1001
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - name: Require reproducible frontend bundles and route chunks
        run: npm run build:check
      - name: Verify every retained async-save and recovery scenario
        run: python scripts/run_continuity_browser_checks.py
      - name: Write all continuity counts
        if: always()
        run: python scripts/write_ci_summary.py --kind continuity
      - name: Upload isolated recovery and draft evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: continuity-browser-reports
          path: |
            artifacts/continuity-browser/*/*
            artifacts/ci-continuity-browser/results.json
            artifacts/ci/summary.md
          retention-days: 14
          if-no-files-found: error
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t campus-notice:ci .
      - name: Start the isolated container without credentials or host data
        run: >-
          docker run -d --name campus-ci --read-only
          --tmpfs /tmp:size=128m,mode=1777 --tmpfs /data:size=128m,mode=1777
          --cap-drop ALL --security-opt no-new-privileges
          -e APP_ENV=production -e APP_ORIGIN=https://campus-ci.invalid
          -p 127.0.0.1:18065:8765 campus-notice:ci
      - name: Verify health, non-root runtime, database and UI prompt resources
        run: |
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent -H 'Host: campus-ci.invalid' http://127.0.0.1:18065/api/health > /tmp/campus-health.json; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then echo 'Container health did not become ready'; exit 1; fi
          python -c 'import json; assert json.load(open("/tmp/campus-health.json"))["status"] == "ok"'
          test "$(docker exec campus-ci id -u)" = 10001
          docker exec campus-ci python manage.py check
          docker exec campus-ci python -c 'from app.genui_prompt import capability_module; assert len(capability_module(1)) > 1000'
          docker exec campus-ci python -c 'from app.documents import file_source; r=file_source("legacy.doc",b"{\\rtf1\\ansi Container parser smoke.\\par Done.}"); assert r["status"] in {"ok","review"} and any("Container parser smoke" in s["text"] for s in r["sections"]), r["warning"]'
          curl --fail --silent -H 'Host: campus-ci.invalid' http://127.0.0.1:18065/ > /tmp/campus-index.html
          grep -q 'id="app"' /tmp/campus-index.html
      - name: Diagnose an isolated container failure
        if: failure()
        run: |
          docker inspect --format '{{.State.Status}} {{.State.ExitCode}} {{.State.Error}}' campus-ci || true
          docker logs --tail 80 campus-ci || true
      - name: Remove the isolated container
        if: always()
        run: docker rm -fv campus-ci 2>/dev/null || true
